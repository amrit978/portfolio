<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense Tracker</title>
  <style>
:root {
  --bg: #f4f6fb;
  --card: #ffffff;
  --text: #1f2937;
  --muted: #6b7280;
  --accent: #4f46e5;
  --accent-soft: #e0e7ff;
  --danger: #dc2626;
  --border: #e5e7eb;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
}

.topbar {
  background: var(--accent);
  color: #fff;
  padding: 24px 16px;
  text-align: center;
}
.topbar h1 { margin: 0; font-size: 1.6rem; }
.topbar p { margin: 4px 0 0; opacity: 0.85; }

.container {
  max-width: 820px;
  margin: 24px auto;
  padding: 0 16px;
  display: grid;
  gap: 16px;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
}
.card h2 { margin: 0 0 12px; font-size: 1.1rem; }

.add-form {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr 1fr auto;
  gap: 8px;
}

input, select, button {
  font: inherit;
  padding: 9px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: #fff;
}
input:focus, select:focus {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

button {
  background: var(--accent);
  color: #fff;
  border: none;
  cursor: pointer;
}
button:hover { filter: brightness(1.1); }
button.danger { background: transparent; color: var(--danger); padding: 4px 8px; }
button.danger:hover { background: #fee2e2; filter: none; }

.summary {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}
.label { display: block; color: var(--muted); font-size: 0.85rem; }
.total { font-size: 2rem; font-weight: 700; }
.filters { display: flex; gap: 8px; align-items: center; }
.reset { color: var(--accent); text-decoration: none; font-size: 0.9rem; }

.flash { padding: 10px 14px; border-radius: 8px; }
.flash.success { background: #dcfce7; color: #166534; }
.flash.error { background: #fee2e2; color: #991b1b; }

.bar-row {
  display: grid;
  grid-template-columns: 110px 1fr 90px;
  align-items: center;
  gap: 10px;
  margin: 8px 0;
}
.bar-track { background: var(--accent-soft); border-radius: 999px; height: 10px; overflow: hidden; }
.bar-fill { background: var(--accent); height: 100%; border-radius: 999px; }
.bar-amt { text-align: right; font-variant-numeric: tabular-nums; }

table { width: 100%; border-collapse: collapse; }
th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid var(--border); }
th { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.tag { background: var(--accent-soft); color: var(--accent); padding: 2px 8px; border-radius: 999px; font-size: 0.8rem; }
.empty { color: var(--muted); text-align: center; padding: 16px 0; }

@media (max-width: 640px) {
  .add-form { grid-template-columns: 1fr 1fr; }
  .add-form input[name="title"] { grid-column: 1 / -1; }
  .bar-row { grid-template-columns: 80px 1fr 80px; }
}

</style>
</head>
<body>
  <header class="topbar">
    <h1>Expense Tracker</h1>
    <p>Track where your money goes.</p>
  </header>

  <main class="container">
    
      
        <div class="flash "></div>
      
    

    <section class="card">
      <h2>Add expense</h2>
      <form action="" method="post" class="add-form">
        <input type="text" name="title" placeholder="What did you spend on?" required>
        <input type="number" name="amount" placeholder="Amount" min="0.01" step="0.01" required>
        <select name="category">
          <option>Food</option>
        </select>
        <input type="date" name="spent_on" value="">
        <button type="submit">Add</button>
      </form>
    </section>

    <section class="card summary">
      <div>
        <span class="label">Total</span>
        <span class="total">₹1,450.00</span>
      </div>
      <form method="get" class="filters">
        <select name="category" onchange="this.form.submit()">
          <option value="">All categories</option>
          
            <option selected>Food</option>
          
        </select>
        <input type="month" name="month" value="" onchange="this.form.submit()">
        <a href="" class="reset">Reset</a>
      </form>
    </section>

    
    <section class="card">
      <h2>By category</h2>
      
        <div class="bar-row">
          <span class="bar-name">Food & Dining</span>
          <div class="bar-track"><div class="bar-fill" style="width: %"></div></div>
          <span class="bar-amt">₹850.00</span>
        </div>
      
    </section>
    

    <section class="card">
      <h2>Expenses</h2>
      
      <table>
        <thead><tr><th>Date</th><th>Title</th><th>Category</th><th class="num">Amount</th><th></th></tr></thead>
        <tbody>
          
          <tr>
            <td></td>
            <td></td>
            <td><span class="tag"></span></td>
            <td class="num">₹</td>
            <td>
              <form action="" method="post">
                <button class="danger" type="submit" aria-label="Delete ">Delete</button>
              </form>
            </td>
          </tr>
          
        </tbody>
      </table>
      
        <p class="empty">No expenses yet. Add your first one above.</p>
      
    </section>
  </main>
</body>
</html>
